<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/master :: layout(~{::title}, ~{::#customHead}, ~{::#content})}">
<!--
    This document's own <html>/<head>/<body> are never rendered: th:replace
    above swaps the whole element for the master layout fragment before it's
    serialized. The markup below only exists so ~{::title}, ~{::#customHead}
    and ~{::#content} have something to select from - see fragments/master.html.
-->
<head>
    <title>Ryyppy.net</title>

    <div id="customHead" th:remove="tag">
        <link rel="stylesheet" href="/static/vendor/jquery-ui/1.8.24/jquery-ui-1.8.24.custom.css" type="text/css" media="screen" />

        <script type="text/javascript" th:src="@{/static/js/common.js}"></script>
        <script type="text/javascript" th:src="@{/static/js/datetimepicker.js}"></script>
        <script type="text/javascript" src="/static/vendor/jquery-ui/1.8.24/jquery-ui-1.8.24.min.js"></script>
        <script type="text/javascript" src="/static/vendor/jquery-ui-timepicker-addon/jquery-ui-timepicker-addon.js"></script>
        <script type="text/javascript" src="/static/vendor/jquery-ui/i18n/jquery.ui.datepicker-fi.js"></script>

        <!-- hack -->
        <!--[if lte IE 8]><script language="javascript" type="text/javascript" src="/static/vendor/excanvas/excanvas.min.js"></script><![endif]-->
        <script type="text/javascript" src="/webjars/flot/0.7/jquery.flot.min.js"></script>
        <script type="text/javascript" src="/webjars/flot/0.7/jquery.flot.crosshair.min.js"></script>
        <script type="text/javascript" src="/webjars/flot/0.7/jquery.flot.resize.min.js"></script>
        <script type="text/javascript" th:src="@{/static/js/userbutton.js}"></script>
        <script type="text/javascript" th:src="@{/static/js/userbuttongrid.js}"></script>
        <script type="text/javascript" th:src="@{/static/js/drinkerchecks.js}"></script>
        <script type="text/javascript" th:src="@{/static/js/userhistorygraph.js}"></script>
        <script type="text/javascript" src="/static/vendor/datejs/date.js"></script>
        <script type="text/javascript" src="/static/vendor/jquery-tmpl/jquery.tmpl.js"></script>

        <script type="text/javascript" th:inline="javascript">
            var userButton = null;
            var userId = /*[[${user.id}]]*/ 0;
            var picker;
            var grid;

            $(document).ready(function() {
                $('#drinkers').height(275);
                grid = new UserButtonGrid($('#drinkers'));
                grid.users = [{'id': userId }];
                grid.updateGrid();

                $('.party').each(function(index) {
                    $(this).css('background-color', colors[index]);
                });

                setInterval(function() {
                    grid.updateButtons();
                }, 60 * 1000);

                var user = { id: /*[[${user.id}]]*/ 0, name: /*[[${user.name}]]*/ '' };

                var element = $('#historyGraph');
                var graph = new UserHistoryGraph(user, element);
                graph.options.legend = { position:'nw' };
                graph.update();
            });

            function configureDrinksDialogOpened() {
                RyyppyAPI.getUserDrinks(/*[[${user.id}]]*/ 0, gotDrinkData);
            }

            function configureDrinksDialogClosed() {
                location.reload(true);
            }

            function formatDate(date) {
                return date.toString('yyyy-MM-dd HH:mm');
            }

            function gotDrinkData(data) {
                $("#drinksList").html("");
                var drinkData = [];
                var drinkingTimeText = /*[[#{user.drink_time}]]*/ '';

                $(data).find('drink').each(function() {
                    var id = $(this).find('id').text();
                    var timestamp = Number($(this).find('timestamp').text());
                    var date = formatDate(new Date(timestamp));
                    drinkData.push({DrinkId: id, DrinkingTimeText: drinkingTimeText, DrinkingTime: date, UserId: userId});
                });

                if (drinkData.length == 0) {
                    var li = $('<li>').html(/*[[#{user.no_drinks}]]*/ '');
                    $("#drinksList").append(li);
                }
                else {
                    $.get('/static/templates/drinkListElement.html', function(template) {
                        $.tmpl(template, drinkData).appendTo('#drinksList');

                        $('.drink').unbind('click');
                        $('.drink').bind('click', function() {
                            var element = $.tmplItem(this);
                            if (confirm(/*[[#{user.remove_drink.confirm}]]*/ ''))
                                $.get('/ui/removeDrink?userId=' + element.data.UserId + '&drinkId=' + element.data.DrinkId, configureDrinksDialogOpened);
                        });
                    });
                }
            }

            $(document).ready(function() {
                $('#logoutLink').click(function() {
                    return confirm($(this).data('confirmMessage'));
                });
                $('.leavePartyLink').click(function() {
                    return confirm($(this).data('confirmMessage'));
                });

                $('#addPartyButtonLink').click(function() {
                    toggleJQUIDialog($('#addPartyDialog'));
                });
                $('#configureDrinkerButtonLink').click(function() {
                    toggleJQUIDialog($('#configureDrinkerDialog'));
                });
                $('#configureDrinksButtonLink').click(function() {
                    toggleJQUIDialog($('#configureDrinksDialog'));
                    $("#configureDrinksAccordion").accordion({ fillSpace: true });
                });

                $('#addPartyDialog').dialog({ width: 600, autoOpen: false, draggable: false, resizable: false });
                $('#configureDrinkerDialog').dialog({ width: 600, autoOpen: false, draggable: false, resizable: false });



                $('#submitTime').click(function() {
                    var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
                    var formattedTime = '{0}.{1}.{2} {3}:{4}'.format(
                        pad(picker.selectedTime.getDate()),
                        pad(picker.selectedTime.getMonth() + 1),
                        picker.selectedTime.getFullYear(),
                        pad(picker.selectedTime.getHours()),
                        pad(picker.selectedTime.getMinutes())
                    );
                    $('#date').val(formattedTime);
                });


                $('#configureDrinksDialog').dialog({
                    modal: true,
                    draggable: false,
                    autoOpen: false,
                    resizable: false,
                    width: 600,

                    open: function() {
                        configureDrinksDialogOpened();
                        $("#configureDrinksAccordion").accordion({ fillSpace: true });
                        picker = new DateTimePicker('#historyDrinkTime');
                    },

                    close: function() {
                        $('#historyDrinkTime').html('');
                    }
                });

                repaint();
            });

            $(window).resize(function() {
                repaint();
            });

            function repaint() {
                var windowWidth = $(window).width();
                var bestWidth = windowWidth - 15;
                $("#drinkers").width(bestWidth);
                $(".party").width(bestWidth);
                $("#historyGraph").width(bestWidth - 35);

                var bestSize = calculateBestDialogSize();
                resizePopupDialogs(bestSize);
            }
        </script>
    </div>
</head>
<body>
    <div id="content" th:remove="tag">
        <div class="header">
            <table style="width: 100%;" class="noBorders">
                <tr>
                    <td class="headerButton"><a id="logoutLink" class="headerButtonA" th:title="#{user.logout_dialog.title}" href="logout" th:attr="data-confirm-message=#{user.logout_dialog.msg}"><div class="headerButton headerButtonLeft" id="goBack"></div></a></td>
                    <td class="topic"><h1 class="topic" th:text="${user.name}">User name</h1></td>
                    <td class="headerButton"><a id="configureDrinkerButtonLink" class="headerButtonA" th:title="#{user.settings}" href="#"><div class="headerButton headerButtonRight" id="configureButton"></div></a></td>
                    <td class="headerButton"><a id="uiSwitchButton" class="headerButtonText" th:title="#{ui.switch_to_modern}" href="/app/index.html#/" th:text="#{ui.modern_ui_label}">New UI</a></td>
                </tr>
            </table>
        </div>

        <!-- stupid css not able to center vertically properly -->
        <div id="body" class="body">
            <table id="drinkers"></table>
        </div>

        <div class="header headerMargin">
            <a id="addPartyButtonLink" class="headerButtonA" th:title="#{user.add_party}" href="#">
                <div id="addPartyButton" class="headerButton headerButtonRight"></div>
            </a>
            <div class="headerTextDiv">
                <h1 th:text="#{user.your_parties}">Your parties</h1>
            </div>
        </div>

        <div class="body">
            <div class="party roundedCornersBordered" th:each="party : ${parties}">
                <div class="marginBox">
                    <a th:href="@{party(id=${party.id})}">
                        <span th:text="${party.name}">Party name</span>
                        <span id="partyStartTime">
                            <span th:text="#{user.start_time}">Starting time</span> <script type="text/javascript" th:inline="javascript">document.write(formatDate(new Date(/*[[${party.startTime.toEpochMilli()}]]*/ 0)));</script>
                        </span>
                    </a>
                        <a class="headerButtonA leavePartyLink" th:title="#{user.exit_dialog.title}" th:attr="data-confirm-message=#{user.exit_dialog.msg}" th:href="@{removeUserFromParty(partyId=${party.id},userId=${user.id})}">
                        <img th:src="@{/static/images/x.png}" alt="sulje" style="float:right; margin-right: 5px;" />
                    </a>
                </div>
            </div>
        </div>

        <div class="header headerMargin">
            <a id="configureDrinksButtonLink" class="headerButtonA" th:title="#{user.add_or_remove_drinks}" href="#">
                <div class="headerButton headerButtonRight" id="configureDrinksButton"></div>
            </a>
            <div class="headerTextDiv">
                <h1 th:text="#{user.history}">History</h1>
            </div>
        </div>

        <div class="body">
            <div id="historyGraph" class="roundedCornersBordered"></div>
        </div>

        <div id="configureDrinksDialog" class="popupDialog" th:title="#{user.history}">
            <div id="configureDrinksAccordion">
                <h2><a href="#" th:text="#{user.add_drinks_at}">Add drinks at time</a></h2>
                <div>
                    <div id="historyDrinkTime"></div>
                    <form method="POST" th:action="@{addDrinkToDate}">
                        <input type="hidden" name="userId" th:value="${user.id}" />
                        <input type="hidden" id="date" name="date" value="" />
                        <input type="submit" value="Lisää" id="submitTime" />
                    </form>
                </div>

                <h2><a href="#" th:text="#{user.remove_drink}">Remove drink</a></h2>
                <div>
                    <ul id="drinksList">
                    </ul>
                </div>
            </div>
        </div>

        <div id="addPartyDialog" class="popupDialog" th:title="#{user.new_party}">
            <form method="POST" th:action="@{addParty}">
                <input type="hidden" name="userId" th:value="${user.id}" />
                <table>
                    <tr>
                        <th th:text="#{form.name}">Name</th>
                        <td><input id="nameInput" type="text" name="name" /></td>
                    </tr>
                    <tr>
                        <th>&nbsp;</th>
                        <td><input type="submit" th:value="#{form.create_party}" /></td>
                    </tr>
                </table>
            </form>
        </div>

        <div id="configureDrinkerDialog" class="popupDialog" th:title="#{user.edit}">
            <form method="post" th:action="@{modifyUser}">
                <input type="hidden" name="userId" th:value="${user.id}" />
                <table>
                    <tr>
                        <th th:text="#{form.name}">Name</th>
                        <td colspan="2"><input id="drinkerName" type="text" name="name" onkeyup="checkDrinkerFields(true);" th:value="${user.name}" /></td>
                    </tr>
                    <tr>
                        <th th:text="#{form.email}">Email</th>
                        <td><input id="email" type="email" name="email" th:value="${user.email}" th:attr="data-original-email=${user.email}" onkeyup="checkEmail($(this).val(), $(this).data('originalEmail')); checkDrinkerFields(true);" /></td>
                        <td style="width:24px;height:24px;" id="emailCorrect">&nbsp;</td>
                    </tr>
                    <tr>
                        <th th:text="#{form.sex}">Gender</th>
                        <td colspan="2">
                            <select name="sex">
                                <option th:selected="${user.sex.name() == 'MALE'}" value="MALE" th:text="#{form.male}">Male</option>
                                <option th:selected="${user.sex.name() == 'FEMALE'}" value="FEMALE" th:text="#{form.female}">Female</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th th:text="#{form.weight}">Weight</th>
                        <td colspan="2"><input th:value="${user.weight}" id="drinkerWeight" type="password" name="weight" onkeyup="checkDrinkerFields(true);" autocomplete="off" /></td>
                    </tr>
                    <tr>
                        <th>&nbsp;</th>
                        <td colspan="2"><input id="submitButton" type="submit" th:value="#{form.save}" /></td>
                    </tr>
                    <tr>
                        <th>&nbsp;</th>
                        <td colspan="2"><a id="passphraseLink" th:href="@{/ui/passphrase}" th:text="#{user.passphrase_link}">Manage your Ryyppy.net key</a></td>
                    </tr>
                </table>
            </form>
        </div>

        <script id="datetimepickerTemplate" type="text/x-jquery-tmpl">
            <form class="datetimepicker" method="post" action="#">
                <table>
                    <tr>
                        <td><input id="increaseDays" type="submit" value="+" /></td>
                        <td><input id="increaseMonths" type="submit" value="+" /></td>
                        <td><input id="increaseYears" type="submit" value="+" /></td>
                    </tr>
                    <tr>
                        <td><input id="dateDay" type="text" value="1" size="2" /></td>
                        <td><input id="dateMonth" type="text" value="1" size="2" /></td>
                        <td><input id="dateYear" type="text" value="2011" size="4" /></td>
                    </tr>
                    <tr>
                        <td><input id="decreaseDays" type="submit" value="-" /></td>
                        <td><input id="decreaseMonths" type="submit" value="-" /></td>
                        <td><input id="decreaseYears" type="submit" value="-" /></td>
                    </tr>
                </table>

                <table>
                    <tr>
                        <td><input id="increaseHours" type="submit" value="+" /></td>
                        <td><input id="increaseMinutes" type="submit" value="+" /></td>
                    </tr>
                    <tr>
                        <td><input id="dateHour" type="text" value="00" size="2" /></td>
                        <td><input id="dateMinute" type="text" value="00" size="2" /></td>
                    </tr>

                    <tr>
                        <td><input id="decreaseHours" type="submit" value="-" /></td>
                        <td><input id="decreaseMinutes" type="submit" value="-" /></td>
                    </tr>
                </table>
            </form>
        </script>
    </div>
</body>
</html>

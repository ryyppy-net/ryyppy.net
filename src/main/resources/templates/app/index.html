<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" ng-app="ryyppy">
<head>
    <meta charset="utf-8">
    <title>Ryyppy.net</title>

    <link rel="preload" as="font" type="font/woff2" th:href="@{/static/fonts/rum-raisin-latin.woff2}" crossorigin/>
    <link rel="preload" as="font" type="font/woff2" th:href="@{/static/fonts/roboto-500-latin.woff2}" crossorigin/>
    <link rel="stylesheet" th:href="@{/static/css/fonts.css}"/>
    <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/static/vendor/font-awesome/font-awesome.css"/>
    <link rel="stylesheet" th:href="@{/app/css/app.css}"/>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ryyppy-net-commit" th:content="${gitCommit}" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="text/javascript" th:src="@{/static/js/sw-client.js}"></script>
</head>
<body>
    <div ng-view></div>
    <toasts th:attr="close-label=#{toast.close}"></toasts>

    <!--
        The current user's profile, parties, own drinks, and drink-history
        graph data (DefaultController.appIndex()), so userPage and the
        promille history graph it renders can skip their first API fetch.
        Written with [(...)] (unescaped inlining), not [[...]]: each value is
        already JavaScript-escaped by JavaScriptUtils.javaScriptEscape() in
        the controller and gets substituted into a single-quoted JS string
        literal below - escaping it again here would corrupt JSON.parse()
        and break the whole dashboard.
    -->
    <script th:inline="javascript">
        window.__INITIAL_PROFILE__ = JSON.parse('[(${initialProfile})]');
        window.__INITIAL_PARTIES__ = JSON.parse('[(${initialParties})]');
        window.__INITIAL_DRINKS__ = JSON.parse('[(${initialDrinks})]');
        window.__INITIAL_DRINK_HISTORY__ = JSON.parse('[(${initialDrinkHistory})]');
    </script>

    <script src="/webjars/angular/1.8.3/angular.min.js"></script>
    <script src="/webjars/angular-route/1.8.3/angular-route.min.js"></script>
    <script src="/webjars/angular-animate/1.8.3/angular-animate.min.js"></script>
    <script src="/webjars/chart.js/4.5.0/dist/chart.umd.min.js"></script>
    <script th:src="@{/app/js/app.js}"></script>
    <script th:src="@{/app/js/services.js}"></script>
    <th:block th:replace="~{fragments/sounds :: player}" />


    <script th:src="@{/app/js/components/userMenu.js}"></script>
    <script th:src="@{/app/js/components/partyMenu.js}"></script>
    <script th:src="@{/app/js/components/userPage.js}"></script>
    <script th:src="@{/app/js/components/profileSettingsPage.js}"></script>
    <script th:src="@{/app/js/components/drinker.js}"></script>
    <script th:src="@{/app/js/components/drinkDialog.js}"></script>
    <script th:src="@{/app/js/components/toasts.js}"></script>
    <script th:src="@{/app/js/components/partyPage.js}"></script>
    <script th:src="@{/app/js/components/generalPartyAdminPage.js}"></script>
    <script th:src="@{/app/js/components/partyAdminPage.js}"></script>

    <script th:src="@{/app/js/userhistorygraph.js}"></script>
    <script th:src="@{/app/js/drinkerchart.js}"></script>
    <script th:src="@{/app/js/drinkoptions.js}"></script>

    <script th:src="@{/app/js/filters.js}"></script>
    <script th:src="@{/app/js/directives.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/master :: layout(~{::title}, ~{::#customHead}, ~{::#content})}">
<head>
    <title th:text="#{consent.page_title}">Connect an app</title>

    <div id="customHead" th:remove="tag">
        <link rel="stylesheet" type="text/css" th:href="@{/static/css/login.css}" />
    </div>
</head>
<body>
    <div id="content" th:remove="tag">
        <div id="logoContainer">
            <img id="logo" th:src="@{/static/images/logo_ryyppy.png}" alt="Ryyppy.net" title="Ryyppy.net" />
        </div>

        <div class="login consent">
            <th:block th:if="${clientName == null}">
                <p class="loginError" th:text="#{consent.unavailable}">This connection request was not found or has expired.</p>
            </th:block>

            <th:block th:if="${clientName != null}">
                <h2 th:text="#{consent.title(${clientName})}">Allow the app to use your account?</h2>

                <p th:text="#{consent.signed_in_as(${email})}">You are signed in as someone@example.com.</p>
                <p th:text="#{consent.access}">The app acts as you.</p>
                <p><strong th:text="#{consent.redirect(${redirectsTo})}">After you answer, you are sent to https://example.com.</strong></p>
                <p th:text="#{consent.warning}">Only allow an app you are connecting yourself right now.</p>

                <form method="post" th:action="@{/oauth2/authorize}">
                    <input type="hidden" name="client_id" th:value="${clientId}">
                    <input type="hidden" name="state" th:value="${state}">
                    <input type="hidden" name="scope" th:each="scope : ${scopes}" th:value="${scope}">
                    <input type="submit" id="allow" th:value="#{consent.allow}" value="Allow">
                </form>

                <form method="post" th:action="@{/oauth2/authorize}">
                    <input type="hidden" name="client_id" th:value="${clientId}">
                    <input type="hidden" name="state" th:value="${state}">
                    <input type="submit" id="deny" th:value="#{consent.deny}" value="Don't allow">
                </form>
            </th:block>
        </div>
    </div>
</body>
</html>

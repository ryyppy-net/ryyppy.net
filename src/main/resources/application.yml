spring:
  application:
    name: ryyppy.net
  datasource:
    url: jdbc:postgresql://localhost/ryyppynet
    username: ryyppynet
    password: ryyppynet
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            # Skip Hibernate's Connection.createClob() capability probe at
            # startup. CockroachDB (used in production on Railway) doesn't
            # implement it and throws SQLFeatureNotSupportedException, which
            # Hibernate catches and logs noisily even though it's harmless -
            # we have no @Lob fields, so force the in-memory LOB creator
            # instead of probing for one.
            non_contextual_creation: true
  session:
    timeout: 90d
    jdbc:
      # Schema is now owned by the Flyway baseline migration (see
      # db/migration/V1__baseline.sql) instead of being (re-)applied on
      # every boot.
      initialize-schema: never
      cleanup-cron: "0 */15 * * * *"
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

  messages:
    basename: messages,drinkcounter.version
  docker:
    compose:
      file: docker/docker-compose.yml

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:REPLACE_THIS}
            client-secret: ${GOOGLE_CLIENT_SECRET:REPLACE_THIS}

server:
  tomcat:
    # Safe only because every JSP is precompiled and registered directly by
    # PrecompiledJspServletInitializer - nothing compiles a JSP at runtime, so
    # nothing needs to resolve a taglib from a jar's TLD at request time.
    additional-tld-skip-patterns: "*.jar"

application:
  version: "@project.version@"
  # Cache-busting token baked in at build time (see maven.build.timestamp.format
  # in pom.xml). Fingerprinted asset URLs are /v/<build id>/<path>, so every
  # build hands out a fresh set of URLs and the previous ones can sit in browser
  # caches indefinitely without ever going stale.
  build-id: "@maven.build.timestamp@"
  cache:
    # How long a browser may keep a fingerprinted (/v/<build id>/...) asset
    # without asking again. Zero means "revalidate every time", which is what
    # local development wants: the build id doesn't change while
    # spring-boot:run is up, so a long max-age would hide edits to files under
    # resources/public until a hard refresh. Deployments override this - see
    # application-production.yml.
    fingerprinted-max-age: 0s

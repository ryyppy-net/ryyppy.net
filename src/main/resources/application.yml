spring:
  config:
    # Re-imported fresh by Spring Cloud's context refresh on every CRaC
    # restore (unlike ${ENV_VAR} placeholders, which resolve from
    # System.getenv() - a JVM-wide cache populated once at startup and
    # frozen into the checkpoint image, so it never reflects the
    # restoring process's actual environment). This file is where
    # restore-time secrets belong; see CheckpointListener and
    # railway-build-aot-cache.sh for how it gets written.
    import: "optional:file:./crac-runtime-config.yml"
  application:
    name: ryyppy.net
  datasource:
    url: jdbc:postgresql://localhost/ryyppynet
    username: ryyppynet
    password: ryyppynet
    driver-class-name: org.postgresql.Driver
    hikari:
      # Required for HikariCheckpointRestoreLifecycle to suspend the pool
      # (rather than just evicting connections while new ones keep getting
      # opened) so a CRaC checkpoint can actually be taken - see
      # CheckpointListener and railway-build-aot-cache.sh.
      allow-pool-suspension: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            # Skip Hibernate's Connection.createClob() capability probe at
            # startup. CockroachDB (used in production on Railway) doesn't
            # implement it and throws SQLFeatureNotSupportedException, which
            # Hibernate catches and logs noisily even though it's harmless -
            # we have no @Lob fields, so force the in-memory LOB creator
            # instead of probing for one.
            non_contextual_creation: true
  session:
    timeout: 365d
    jdbc:
      # Schema is now owned by the Flyway baseline migration (see
      # db/migration/V1__baseline.sql) instead of being (re-)applied on
      # every boot.
      initialize-schema: never
      cleanup-cron: "0 */15 * * * *"
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

  messages:
    basename: messages,drinkcounter.version
  docker:
    compose:
      file: docker/docker-compose.yml
  cloud:
    refresh:
      # Rebind these beans against the live environment after a CRaC
      # restore, instead of reusing whatever connection details were baked
      # in when the checkpoint was taken - see CheckpointListener.
      extra-refreshable:
        - javax.sql.DataSource
        - com.zaxxer.hikari.HikariDataSource

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:REPLACE_THIS}
            client-secret: ${GOOGLE_CLIENT_SECRET:REPLACE_THIS}

server:
  servlet:
    session:
      cookie:
        # Without an explicit max-age the SESSION cookie has none of its own,
        # making it a browser-session cookie that's dropped on browser/app
        # restart - well short of the server-side timeout above
        # (spring.session.timeout). Match it here so the cookie actually
        # outlives a restart.
        max-age: 365d
  tomcat:
    # Safe only because every JSP is precompiled and registered directly by
    # PrecompiledJspServletInitializer - nothing compiles a JSP at runtime, so
    # nothing needs to resolve a taglib from a jar's TLD at request time.
    additional-tld-skip-patterns: "*.jar"

application:
  version: "@project.version@"
# Messages in mcp.html
mcp.title = Yhdist\u00e4 MCP-asiakasohjelma
mcp.intro = Ryyppy.netiss\u00e4 on MCP-palvelin. MCP-asiakasohjelma, kuten Claude Code, voi yhdist\u00e4\u00e4 siihen ja k\u00e4sitell\u00e4 Ryyppy.net-tietojasi puolestasi.
mcp.connect.header = Palvelimen lis\u00e4\u00e4minen
mcp.connect.address = Palvelimen osoite on
mcp.connect.claude_code = Lis\u00e4\u00e4 se Claude Codeen t\u00e4ll\u00e4 komennolla:
mcp.signin.header = Kirjautuminen
mcp.signin.intro = Asiakasohjelman t\u00e4ytyy kirjautua sis\u00e4\u00e4n sinuna, ennen kuin se voi k\u00e4ytt\u00e4\u00e4 palvelinta:
mcp.signin.step1 = K\u00e4ynnist\u00e4 Claude Code ja suorita /mcp. Valitse listasta ryyppynet ja valitse todennus.
mcp.signin.step2 = Selaimesi avaa Ryyppy.netin kirjautumissivun. Kirjaudu kuten aina, s\u00e4hk\u00f6postilla ja salasanalla tai Googlella.
mcp.signin.step3 = Ryyppy.net ohjaa selaimesi takaisin asiakasohjelmaan, joka kuuntelee omalla koneellasi. Palaa asiakasohjelmaan: yhteys on nyt valmis.
mcp.signin.no_approval = Ryyppy.net ei pyyd\u00e4 sinua hyv\u00e4ksym\u00e4\u00e4n asiakasohjelmaa erikseen. Kirjautuminen on ainoa hyv\u00e4ksynt\u00e4, joten yhdist\u00e4 vain asiakasohjelmia, joihin luotat.
mcp.access.header = Mit\u00e4 yhdistetty asiakasohjelma n\u00e4kee ja voi tehd\u00e4
mcp.access.acts_as = Asiakasohjelma toimii sinuna. Se n\u00e4kee sen mink\u00e4 sin\u00e4kin n\u00e4et, eik\u00e4 mit\u00e4\u00e4n muuta: sovelluksen k\u00e4ytt\u00f6oikeuss\u00e4\u00e4nn\u00f6t koskevat sit\u00e4 samoin kuin sinua.
mcp.access.tool = T\u00e4ll\u00e4 hetkell\u00e4 sill\u00e4 on yksi ty\u00f6kalu, list_parties. Se listaa bileet, joiden j\u00e4sen olet, uusin ensin, ja kertoo kunkin bileiden tunnuksen, nimen, alku- ja loppuajan sek\u00e4 sen, ovatko ne p\u00e4\u00e4ttyneet.
mcp.access.readonly = Ty\u00f6kalu vain lukee. Yhdistetty asiakasohjelma ei voi kirjata, muuttaa tai poistaa juomia, muuttaa profiiliasi eik\u00e4 muuttaa bileit\u00e4.
mcp.duration.header = Kuinka kauan yhteys kest\u00e4\u00e4
mcp.duration.text = Yhteys kest\u00e4\u00e4 5 minuuttia. Claude Coden kaltaiset asiakasohjelmat eiv\u00e4t saa tapaa uusia sit\u00e4 huomaamatta, joten 5 minuutin j\u00e4lkeen asiakasohjelma pyyt\u00e4\u00e4 sinua kirjautumaan uudelleen samoilla vaiheilla kuin yll\u00e4.
mcp.limits.header = Asiakasohjelmat, jotka eiv\u00e4t viel\u00e4 yhdisty
mcp.limits.text = Claude Desktop ja claude.ai eiv\u00e4t viel\u00e4 p\u00e4\u00e4se yhdist\u00e4m\u00e4\u00e4n Ryyppy.netiin. Claude Coden komentorivity\u00f6kalu p\u00e4\u00e4see.

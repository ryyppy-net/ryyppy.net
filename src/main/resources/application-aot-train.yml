# Used only by the JDK AOT cache training run in the Dockerfile.
#
# A `docker build` has no service containers, so there is no real Postgres
# for the training boot to reach. It boots against an in-memory HSQLDB
# instead, which is enough for the context to refresh for real: Hikari opens
# a pool, Hibernate resolves a dialect and builds a SessionFactory, and every
# bean in the application is instantiated - so the cache still covers the
# bulk of the boot path.
#
# What it does not cover is the Postgres-specific half: the pgjdbc driver
# and the PostgreSQL dialect. Those classes get loaded and linked normally
# on the first production boot instead of coming from the cache.
#
# Flyway is off and ddl-auto creates the schema because db/migration's
# baseline is a Postgres DDL dump (bytea columns and friends) that HSQLDB
# cannot execute.
spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:hsqldb:mem:aottrain
    username: sa
    password: ""
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  jpa:
    hibernate:
      ddl-auto: create
  flyway:
    enabled: false

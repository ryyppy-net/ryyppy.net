# Used only during the build (see scripts/railway-build.sh, both the JDK
# AOT cache pass and the CRaC checkpoint pass) - boots against a real,
# ephemeral PostgreSQL instance the build script starts locally on
# 127.0.0.1 (Docker isn't available during a Railway build, so the script
# runs actual Postgres server binaries directly - see the script for how).
# Everything else - dialect, ddl-auto, session-jdbc schema init - is left
# as the base application.yml configures it, since the entire point of
# training against real Postgres instead of an in-memory substitute is to
# exercise the same JDBC driver, SQL dialect, and connection pool code
# paths production actually boots with.
#
# Deliberately not setting spring.datasource.* here even though this
# profile is exactly where the training database's connection details are
# needed: this file's precedence, as a profile-specific document, is
# *above* the config-imported file production restore relies on (see
# application.yml's spring.config.import and CheckpointListener) to swap
# in real credentials after a CRaC restore - active profiles stay frozen
# in the checkpoint, so any spring.datasource.* set here would keep
# winning over that file forever after restore, no matter its content.
# scripts/railway-build.sh instead points the training runs at the
# training database through that same config-imported file, so there's
# only ever one source to consider, not two competing ones.
spring:
  docker:
    compose:
      enabled: false
  # The build script applies V1__baseline.sql to the training database
  # directly (see scripts/railway-build.sh) instead of relying on this
  # boot to run it: Flyway's classpath scan for db/migration doesn't find
  # anything from the extracted thin-war layout the training run boots
  # from (its resources land at the war root, not under WEB-INF/classes,
  # there). Leaving Flyway enabled here would have it try, fail to find
  # any migrations, and then fail Hibernate's schema validation once it
  # (wrongly) concludes the schema is still empty.
  flyway:
    enabled: false

# Flyway owns schema migrations, and CI/PR-preview environments already
# validate schema/entity consistency, so the base ddl-auto: validate check
# is redundant here and only adds startup latency (see #38).
spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    # Migrations run via railway.json's pre-deploy command instead.
    enabled: false

# Must live here, not only in Railway's SERVER_FORWARD_HEADERS_STRATEGY: the
# filter behind this is @ConditionalOnProperty(...havingValue="framework") and
# process-aot freezes @Conditional evaluation at build time, where the Docker
# build can't see Railway's service variables.
server:
  forward-headers-strategy: framework

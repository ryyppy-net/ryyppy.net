# Flyway owns schema migrations, and CI/PR-preview environments already
# validate schema/entity consistency, so the base ddl-auto: validate check
# is redundant here and only adds startup latency (see #38).
spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    # Migrations run via railway.json's pre-deploy command instead.
    enabled: false
  datasource:
    # minimum-idle: 0 lets the pool drop to no open connections, so Railway's
    # serverless sleep can detect the service as idle.
    #
    # allow-pool-suspension lets the pool be drained before the image's CRaC
    # checkpoint (see checkpoint.sh); CRaC will not checkpoint open sockets.
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 10000
      allow-pool-suspension: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 6115241938-fkfn0jc12l66aelicc3v19so1e9gl58o.apps.googleusercontent.com

# Railway terminates TLS at its edge, so trust X-Forwarded-* to see the
# original https scheme and host.
server:
  forward-headers-strategy: framework

# The ingesting host of the ryyppy.net source in Better Stack. process-aot only
# builds the exporters if the endpoints are set when it runs.
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: https://s2800235.us-west-2a.betterstackdata.com/v1/traces
          compression: gzip
          headers:
            Authorization: Bearer ${BETTERSTACK_SOURCE_TOKEN:}
    logging:
      export:
        otlp:
          endpoint: https://s2800235.us-west-2a.betterstackdata.com/v1/logs
          compression: gzip
          headers:
            Authorization: Bearer ${BETTERSTACK_SOURCE_TOKEN:}

# ryyppy.net is the domain actually registered in Google Cloud Console for
# Google sign-in; every environment's login page points there (see
# GlobalControllerAdvice#oneTapLoginUri).
google:
  auth:
    hub-url: https://ryyppy.net

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Frontend WebJars: held back until e2e coverage of a version bump is trusted.
      - dependency-name: "org.webjars:*"

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Only LTS JDKs (25, then 29): a feature release is a manual bump.
      - dependency-name: "azul/zulu-openjdk"
        update-types: ["version-update:semver-major"]
